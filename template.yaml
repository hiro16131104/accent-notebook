AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Accent Notebook - Flask on Lambda (Lambda Web Adapter) + API Gateway REST

# ==============================================================
# パラメータ
# ==============================================================
Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
    Description: デプロイ先の環境

# ==============================================================
# グローバル設定（全 Lambda 関数に適用）
# ==============================================================
Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Architectures:
      - arm64

# ==============================================================
# リソース
# ==============================================================
Resources:

  # ── Lambda 実行ロール（最小権限）────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "accent-notebook-lambda-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # CloudWatch Logs への書き込み権限のみ付与する
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # アプリ設定値（SECRET_KEY・GOOGLE_CLIENT_ID など）を SSM パラメータストア
        # から読み取る権限。対象環境の envs/ 配下のみに限定する
        - PolicyName: !Sub "accent-notebook-ssm-read-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/accent-notebook/${Environment}/envs/*"
              # SECRET_KEY は SecureString のため、復号に使う既定の
              # SSM 用 KMS キー（aws/ssm）への Decrypt 権限も必要
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm"
        # 単語データを格納する DynamoDB テーブル（手動作成済み）への
        # アクセス権限。対象環境のテーブルのみに限定する
        - PolicyName: !Sub "accent-notebook-dynamodb-access-${Environment}"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/accent-notebook-words-${Environment}"

  # ── Lambda 関数 ──────────────────────────────────────────────
  AccentNotebookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "accent-notebook-${Environment}"
      Role: !GetAtt LambdaExecutionRole.Arn
      PackageType: Image
      Environment:
        Variables:
          PORT: "8080"
          APP_ENV: !Ref Environment
          # LWA がアプリの起動完了を確認するパス
          AWS_LWA_READINESS_CHECK_PATH: "/"
          # Flask セッション署名用 SECRET_KEY を格納した SSM パラメータ名
          SECRET_KEY_PARAM: !Sub "/accent-notebook/${Environment}/envs/SECRET_KEY"
          # Google OAuth クライアントIDを格納した SSM パラメータ名
          GOOGLE_CLIENT_ID_PARAM: !Sub "/accent-notebook/${Environment}/envs/GOOGLE_CLIENT_ID"
          # 単語データを格納する DynamoDB テーブル名（機密情報ではないため直値）
          WORDS_TABLE_NAME: !Sub "accent-notebook-words-${Environment}"
      Events:
        # ルートパス（/）
        RootPath:
          Type: Api
          Properties:
            RestApiId: !Ref AccentNotebookApi
            Path: /
            Method: ANY
        # それ以外の全パス
        ProxyPath:
          Type: Api
          Properties:
            RestApiId: !Ref AccentNotebookApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      DockerTag: latest
      DockerContext: ./
      Dockerfile: Dockerfile

  # ── CloudWatch Logs（ログ保持期間を明示管理）────────────────
  AccentNotebookLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/accent-notebook-${Environment}"
      RetentionInDays: !If [IsProd, 90, 14]

  # ── API Gateway REST API ─────────────────────────────────────
  AccentNotebookApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "accent-notebook-api-${Environment}"
      StageName: !Ref Environment
      EndpointConfiguration:
        Type: REGIONAL

# ==============================================================
# 条件
# ==============================================================
Conditions:
  IsProd: !Equals [!Ref Environment, prod]

# ==============================================================
# 出力
# ==============================================================
Outputs:
  ApiEndpoint:
    Description: API Gateway エンドポイント URL（ステージプレフィックスあり）
    Value: !Sub "https://${AccentNotebookApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/"
    Export:
      Name: !Sub "accent-notebook-${Environment}-api-endpoint"

  LambdaFunctionArn:
    Description: Lambda 関数 ARN
    Value: !GetAtt AccentNotebookFunction.Arn
    Export:
      Name: !Sub "accent-notebook-${Environment}-function-arn"

  LambdaFunctionName:
    Description: Lambda 関数名
    Value: !Ref AccentNotebookFunction
