{% extends "base.html" %} {% block head %}
<style>
  .app-dialog {
    border: none;
    padding: 0;
    position: fixed;
    top: 50%;
    left: 50%;
    margin: 0;
    transform: translate(-50%, -50%);
    max-height: 85vh;
    overflow-y: auto;
  }
  .app-dialog::backdrop {
    background: rgb(0 0 0 / 0.4);
  }
</style>
{% endblock %} {% block content %}
<div class="space-y-4">
  <div class="flex items-center justify-between gap-3">
    <h1 class="text-xl font-bold">単語一覧</h1>
    <button
      type="button"
      id="open-add-word"
      class="inline-flex items-center gap-1.5 rounded-lg bg-indigo-600 text-white text-sm font-semibold px-4 py-2 shadow-sm hover:bg-indigo-700 transition-colors shrink-0"
    >
      <svg
        viewBox="0 0 24 24"
        class="w-4 h-4 shrink-0"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
      >
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
      <span class="whitespace-nowrap">単語を追加</span>
    </button>
  </div>

  <section
    aria-label="検索・絞り込み"
    class="bg-white rounded-xl border border-gray-200 shadow-sm p-4"
  >
    <div class="flex flex-wrap items-center gap-3">
      <div class="w-full sm:flex-1 sm:min-w-[160px]">
        <label for="search-input" class="sr-only">検索</label>
        <input
          id="search-input"
          type="search"
          placeholder="表記・読みで検索"
          class="w-full rounded-lg border border-gray-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>
      <label class="flex items-center gap-1.5 text-sm text-gray-600">
        <input id="bookmark-filter" type="checkbox" class="rounded border-gray-300 accent-indigo-600" />
        ブックマークのみ
      </label>
      <div>
        <label for="sort-mode" class="sr-only">並び順</label>
        <select
          id="sort-mode"
          class="rounded-lg border border-gray-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
          <option value="reading">50音順</option>
          <option value="createdAt">登録日順</option>
        </select>
      </div>
    </div>
  </section>

  <div
    id="selection-toolbar"
    class="hidden items-center justify-between gap-2 flex-wrap bg-gray-100 rounded-lg px-3 py-2 text-sm"
  >
    <label class="flex items-center gap-1.5 text-gray-600">
      <input id="select-all" type="checkbox" class="rounded border-gray-300 accent-indigo-600" />
      すべて選択
    </label>
    <div class="flex items-center gap-3">
      <span id="selection-count" class="text-gray-600"></span>
      <button
        type="button"
        id="clear-selection"
        class="text-gray-500 hover:text-gray-800 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        選択解除
      </button>
      <button
        type="button"
        id="delete-selected"
        class="text-red-600 font-semibold hover:text-red-800 disabled:opacity-40 disabled:cursor-not-allowed"
      >
        削除
      </button>
    </div>
  </div>

  <section aria-label="単語一覧">
    <div id="empty-message" class="hidden text-left py-10">
      <p class="text-sm text-gray-600 mb-1">登録された単語がまだありません。</p>
      <p class="text-xs text-gray-400">
        右上の「単語を追加」から、表記・読み・アクセント（高低）を登録してみましょう。<br />
        黒い線が高い部分、赤い印が下がり目（アクセント核）を表します。
      </p>
    </div>
    <ul id="word-list" class="space-y-2" aria-label="単語一覧"></ul>
  </section>

  <dialog
    id="add-word-dialog"
    class="app-dialog rounded-xl shadow-xl w-full max-w-lg"
    aria-labelledby="add-word-heading"
  >
    <div class="p-4">
      <div class="flex items-center justify-between mb-3">
        <h2 id="add-word-heading" class="text-base font-bold">単語を追加</h2>
        <button
          type="button"
          id="close-add-word"
          class="text-gray-400 hover:text-gray-700 text-xl leading-none px-1 disabled:opacity-40 disabled:cursor-not-allowed"
          aria-label="閉じる"
        >
          &times;
        </button>
      </div>
      <form id="word-form" class="space-y-3" novalidate>
        <div id="form-error" class="hidden text-sm text-red-600" role="alert"></div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label for="word-input" class="block text-xs font-semibold text-gray-600 mb-1"
              >表記</label
            >
            <input
              id="word-input"
              name="word"
              type="text"
              required
              class="w-full rounded-lg border border-gray-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>
          <div>
            <label for="reading-input" class="block text-xs font-semibold text-gray-600 mb-1"
              >読み（ひらがな）</label
            >
            <input
              id="reading-input"
              name="reading"
              type="text"
              required
              class="w-full rounded-lg border border-gray-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>
        </div>

        <div>
          <span class="block text-xs font-semibold text-gray-600 mb-1"
            >アクセント（タップ・クリックして選択してください）</span
          >
          <div id="mora-editor" class="flex flex-wrap gap-1" aria-label="拍ピッチエディタ"></div>
        </div>

        <div>
          <span class="block text-xs font-semibold text-gray-600 mb-1">プレビュー</span>
          <div id="pitch-preview" class="min-h-[2rem]"></div>
        </div>

        <div>
          <label for="note-input" class="block text-xs font-semibold text-gray-600 mb-1"
            >メモ（任意）</label
          >
          <textarea
            id="note-input"
            name="note"
            rows="2"
            class="w-full rounded-lg border border-gray-300 px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          ></textarea>
        </div>

        <div class="flex justify-end pt-1">
          <button
            type="submit"
            id="word-form-submit"
            class="bg-indigo-600 text-white text-sm font-semibold rounded-lg px-4 py-1.5 hover:bg-indigo-700 transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
          >
            追加
          </button>
        </div>
      </form>
    </div>
  </dialog>

  <dialog
    id="delete-confirm-dialog"
    class="app-dialog rounded-xl shadow-xl w-full max-w-sm"
    aria-labelledby="delete-confirm-heading"
  >
    <div class="p-4">
      <h2 id="delete-confirm-heading" class="text-base font-bold mb-2">削除の確認</h2>
      <p id="delete-confirm-message" class="text-sm text-gray-600 mb-4"></p>
      <p id="delete-confirm-error" class="hidden text-sm text-red-600 mb-4" role="alert"></p>
      <div class="flex justify-end gap-2">
        <button
          type="button"
          id="delete-confirm-cancel"
          class="text-sm font-semibold text-gray-600 rounded-lg px-4 py-1.5 hover:bg-gray-100 transition-colors disabled:opacity-40 disabled:cursor-not-allowed"
        >
          キャンセル
        </button>
        <button
          type="button"
          id="delete-confirm-ok"
          class="bg-red-600 text-white text-sm font-semibold rounded-lg px-4 py-1.5 hover:bg-red-700 transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
        >
          削除
        </button>
      </div>
    </div>
  </dialog>
</div>
{% endblock %} {% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
{% endblock %}
